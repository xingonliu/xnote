name: Flutter quality gate

on:
  push:
    paths:
      - '.github/workflows/flutter.yml'
      - 'flutter/**'
      - 'THIRD_PARTY_NOTICES.md'
  pull_request:
    paths:
      - '.github/workflows/flutter.yml'
      - 'flutter/**'
      - 'THIRD_PARTY_NOTICES.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, analyze, test, and build Android
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.3
          cache: true
          pub-cache: true

      - name: Run the shared quality gate
        shell: pwsh
        run: .\flutter\tool\verify.ps1 -Release
